<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>LifeLens 提醒</title>
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <div class="toast" id="toast" role="alert">
    <span class="logo" aria-hidden="true"></span>
    <div class="text">
      <strong id="title"></strong>
      <p id="body"></p>
    </div>
    <button type="button" id="close" aria-label="关闭提醒">×</button>
  </div>
  <script src="toast.js"></script>
</body>
</html>
